<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo gradiente oscuro elegante -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Resplandor neón YouTube Stream -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ff47"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#d61c1c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle redondeada estilo Ubuntu/GNOME -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6"/>

  <!-- Borde neón sutil interno -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.35"/>

  <!-- Canales de ecualizador / controller faders en segundo plano -->
  <g opacity="0.22">
    <line x1="160" y1="120" x2="160" y2="390" stroke="#71717a" stroke-width="8" stroke-linecap="round"/>
    <line x1="256" y1="120" x2="256" y2="390" stroke="#71717a" stroke-width="8" stroke-linecap="round"/>
    <line x1="352" y1="120" x2="352" y2="390" stroke="#71717a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Perillas de faders estilizadas -->
  <rect x="136" y="270" width="48" height="24" rx="8" fill="#3f3f46" stroke="#e8ff47" stroke-width="2" opacity="0.8"/>
  <rect x="328" y="190" width="48" height="24" rx="8" fill="#3f3f46" stroke="#00ffcc" stroke-width="2" opacity="0.8"/>

  <!-- Escudo central con botón Play (YouTube) -->
  <rect x="166" y="186" width="180" height="140" rx="36" fill="url(#redGrad)" filter="url(#glow)"/>

  <!-- Triángulo Play en blanco puro -->
  <polygon points="236,220 236,292 300,256" fill="#ffffff" stroke-linejoin="round"/>

  <!-- Indicador LED REC en vivo -->
  <circle cx="395" cy="115" r="16" fill="#ff3344" filter="url(#glow)"/>
  <circle cx="395" cy="115" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
