<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📺 YouTube Stream Controller — Viewer</title>

<!-- Favicon compatible con Firefox, Chrome y navegadores modernos -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="alternate icon" type="image/png" href="/assets/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/viewer.css?v=2.2">
</head>
<body>

<div id="waiting">
  <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="28" stroke="#555" stroke-width="2"/>
    <path d="M26 20 L46 32 L26 44 Z" fill="#555"/>
  </svg>
  <p>Esperando selección desde el controlador…</p>
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p>RESOLVIENDO STREAM 1080P...</p>
</div>

<div id="player-container">
  <video id="video-player" playsinline muted loop></video>
  <audio id="audio-player" loop></audio>
</div>

<div id="fullscreenControls">
  <button class="btn-fullscreen" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>
</div>

<script src="js/viewer.js"></script>
</body>
</html>
