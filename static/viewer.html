<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🔴 VIEWER — REC</title>

<!-- Favicon compatible con Firefox, Chrome y navegadores modernos -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔴</text></svg>">
<link rel="alternate icon" type="image/png" href="/assets/icon.png">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Space Mono', 'Courier New', monospace;
  }

  #player-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  #video-player {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  #audio-player {
    display: none;
  }

  #loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e8ff47;
    font-size: 13px;
    letter-spacing: 0.15em;
    transition: opacity 0.4s ease;
    opacity: 0;
    pointer-events: none;
    gap: 12px;
  }
  #loading-overlay.active { opacity: 1; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #333;
    border-top-color: #e8ff47;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #waiting {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 20;
    gap: 18px;
    color: #444;
    transition: opacity 0.6s;
  }
  #waiting.hidden { opacity: 0; pointer-events: none; }
  #waiting svg { opacity: 0.25; }
  #waiting p { font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; }

  /* Controles flotantes mínimos (Pantalla completa / Fullscreen) */
  #fullscreenControls {
    position: fixed;
    bottom: 14px; right: 14px;
    z-index: 30;
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #fullscreenControls:hover { opacity: 1; }
  
  .btn-fullscreen:hover { color: #fff; border-color: #e8ff47; }
</style>
</head>
<body>

<div id="waiting">
  <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="28" stroke="#555" stroke-width="2"/>
    <path d="M26 20 L46 32 L26 44 Z" fill="#555"/>
  </svg>
  <p>Esperando selección desde el controlador…</p>
</div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p>RESOLVIENDO STREAM 1080P...</p>
</div>

<div id="player-container">
  <video id="video-player" playsinline muted loop></video>
  <audio id="audio-player" loop></audio>
</div>

<div id="fullscreenControls">
  <button class="btn-fullscreen" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

</div>

<script>
const video = document.getElementById('video-player');
const audio = document.getElementById('audio-player');
const waitingScreen = document.getElementById('waiting');
const loadingOverlay = document.getElementById('loading-overlay');

let currentPlaybackRate = 1.7;
let isMuted = true;
let currentPlayingId = '';
let usesCombinedMedia = false;
let playbackMode = 'original';
let adaptiveRecoveryInProgress = false;
let audioFallbackRequested = false;

// ─── SINCRONIZACIÓN DE VIDEO Y AUDIO HTML5 ───
video.addEventListener('play', () => {
  if (!usesCombinedMedia) audio.play().catch(() => {});
});
video.addEventListener('pause', () => {
  if (!isLooping && !usesCombinedMedia) audio.pause();
});
video.addEventListener('error', () => {
  if (!usesCombinedMedia && currentPlayingId && !audioFallbackRequested) {
    switchToCombinedMedia();
  }
});
video.addEventListener('waiting', () => {
  if (!isLooping) {
    audio.pause();
    handleBuffering();
  }
});
video.addEventListener('stalled', () => {
  if (!isLooping) handleBuffering();
});

video.addEventListener('playing', () => {
  if (!usesCombinedMedia) {
    if (Math.abs(video.currentTime - audio.currentTime) > 0.3) {
      audio.currentTime = video.currentTime;
    }
    audio.play().catch(e => console.warn("Esperando interacción para audio", e));
  }
});

video.addEventListener('seeked', () => {
  if (!usesCombinedMedia) audio.currentTime = video.currentTime;
});

// Bucle continuo garantizado
let isLooping = false;
function loopPlayback() {
  if (isLooping) return;
  isLooping = true;
  video.currentTime = 0;
  if (!usesCombinedMedia) {
    audio.currentTime = 0;
  }
  const pVideo = video.play();
  if (pVideo !== undefined) {
    pVideo.catch(() => {});
  }
  if (!usesCombinedMedia && !isMuted) {
    const pAudio = audio.play();
    if (pAudio !== undefined) {
      pAudio.catch(() => {});
    }
  }
  setTimeout(() => { isLooping = false; }, 400);
}

video.addEventListener('ended', loopPlayback);
audio.addEventListener('ended', () => {
  if (!usesCombinedMedia) loopPlayback();
});

video.addEventListener('timeupdate', () => {
  if (video.duration > 0 && (video.duration - video.currentTime) <= 0.35) {
    loopPlayback();
  }
});

/**
 * Aplica el estado actual de reproducción (velocidad, muteo y canales de audio).
 */
function applyState() {
  video.playbackRate = currentPlaybackRate;
  audio.playbackRate = currentPlaybackRate;

  if (usesCombinedMedia) {
    // 1. Audio integrado en la misma pista del video (fallback / cache / stream único)
    video.muted = isMuted;
    audio.muted = true;
    try { audio.pause(); } catch(e) {}
  } else {
    // 2. Audio separado en elemento <audio> (stream original 1080p sin sonido)
    video.muted = true;
    audio.muted = isMuted;
    if (!isMuted && !video.paused && audio.src && audio.paused) {
      audio.play().catch(() => {});
    }
  }
}

/**
 * Inicia la reproducción de video y audio garantizando compatibilidad con políticas de autoplay.
 */
function startVideoPlayback() {
  if (!video.src) return;
  if (isMuted) {
    video.muted = true;
    audio.muted = true;
  } else if (usesCombinedMedia) {
    video.muted = false;
  }

  video.play().then(() => {
    applyState();
    if (!usesCombinedMedia && !isMuted && audio.src && audio.paused) {
      audio.play().catch(() => {});
    }
  }).catch(() => {
    // Fallback: reproducir en mute si el navegador bloquea el autoplay con sonido
    video.muted = true;
    video.play().then(() => {
      applyState();
    }).catch(() => {});
  });
}

/**
 * Cambia a medio combinado (video + audio en la misma pista) en caso de fallo de sincronización.
 */
async function switchToCombinedMedia() {
  if (audioFallbackRequested) return;
  audioFallbackRequested = true;
  try {
    const response = await fetch(`/api/get_video_url?v=${encodeURIComponent(currentPlayingId)}&fallback=combined&fresh=1&ts=${Date.now()}`);
    const data = await response.json();
    if (!data.video_url) {
      loadingOverlay.classList.remove('active');
      return;
    }
    const position = video.currentTime || 0;
    usesCombinedMedia = true;
    audio.removeAttribute('src');
    audio.load();
    video.src = data.video_url;
    applyState();

    let fallbackStarted = false;
    const onFallbackReady = () => {
      if (fallbackStarted) return;
      fallbackStarted = true;
      if (position > 0) video.currentTime = position;
      loadingOverlay.classList.remove('active');
      startVideoPlayback();
    };

    video.onloadeddata = onFallbackReady;
    video.oncanplay = onFallbackReady;
    if (video.readyState >= 2) onFallbackReady();
  } catch(e) {
    loadingOverlay.classList.remove('active');
  }
}

async function handleBuffering() {
  if (playbackMode !== 'adaptive' || adaptiveRecoveryInProgress) return;
  adaptiveRecoveryInProgress = true;
  currentPlaybackRate = Math.max(1, +(currentPlaybackRate - 0.2).toFixed(1));
  try {
    const response = await fetch(`/api/cache/status/${encodeURIComponent(currentPlayingId)}`);
    const data = await response.json();
    if (data.status === 'ready' && data.url && video.currentSrc !== new URL(data.url, window.location.href).href) {
      const position = video.currentTime || 0;
      video.src = data.url;
      usesCombinedMedia = true;
      audio.removeAttribute('src');
      audio.load();
      video.onloadedmetadata = () => {
        video.currentTime = position;
        video.onloadedmetadata = null;
        startVideoPlayback();
      };
    }
  } catch(e) {}
  setTimeout(() => { adaptiveRecoveryInProgress = false; }, 1500);
}

// ─── RESOLUCIÓN Y REPRODUCCIÓN ───
let _prefetchTimer = null;

async function playVideo(videoId, title = "") {
  if (!videoId) return;
  currentPlayingId = videoId;
  audioFallbackRequested = false;
  waitingScreen.classList.add('hidden');
  loadingOverlay.classList.add('active');

  // Cancelar prefetch anterior si existe
  if (_prefetchTimer) { clearTimeout(_prefetchTimer); _prefetchTimer = null; }

  if (title) {
    document.title = `🔴 ${title} — VIEWER`;
  }

  try {
    const response = await fetch(`/api/get_video_url?v=${videoId}`);
    const data = await response.json();

    if (data.video_url && data.audio_url) {
      usesCombinedMedia = Boolean(data.combined_audio || data.video_url === data.audio_url);
      video.src = data.video_url;
      if (usesCombinedMedia) {
        audio.removeAttribute('src');
        audio.load();
      } else {
        audio.src = data.audio_url;
      }

      applyState();

      let playbackStarted = false;
      const onReadyToPlay = () => {
        if (playbackStarted) return;
        playbackStarted = true;
        loadingOverlay.classList.remove('active');
        startVideoPlayback();
      };

      video.onloadeddata = onReadyToPlay;
      video.oncanplay = onReadyToPlay;
      if (video.readyState >= 2) {
        onReadyToPlay();
      }

      video.onerror = () => {
        if (!audioFallbackRequested) {
          switchToCombinedMedia();
        } else {
          loadingOverlay.classList.remove('active');
        }
      };

      audio.onerror = () => {
        if (!usesCombinedMedia && !audioFallbackRequested) {
          switchToCombinedMedia();
        }
      };

      // Watchdog de seguridad si la red tarda
      setTimeout(() => {
        if (loadingOverlay.classList.contains('active') && currentPlayingId === videoId) {
          if (!usesCombinedMedia) {
            switchToCombinedMedia();
          } else {
            loadingOverlay.classList.remove('active');
            startVideoPlayback();
          }
        }
      }, 5000);

      // ─── PREFETCH PROACTIVO: renovar URL 2 minutos antes de que expire ───
      if (data.expires_at) {
        const msUntilExpiry = (data.expires_at * 1000) - Date.now();
        const prefetchIn = Math.max(30000, msUntilExpiry - 120000); // 2 min antes, mínimo 30s
        console.log(`[viewer] URL de ${videoId} expira en ${Math.round(msUntilExpiry/1000)}s, prefetch en ${Math.round(prefetchIn/1000)}s`);
        _prefetchTimer = setTimeout(async () => {
          if (currentPlayingId !== videoId) return;
          console.log(`[viewer] Renovando URL de ${videoId} proactivamente...`);
          try {
            // Pedir al servidor que renueve la URL en cache
            await fetch(`/api/prefetch_video_url?v=${videoId}`);
            // Esperar ~15s para que el servidor la tenga lista y luego reasignar src
            await new Promise(r => setTimeout(r, 15000));
            if (currentPlayingId !== videoId) return;
            const fresh = await fetch(`/api/get_video_url?v=${videoId}`);
            const freshData = await fresh.json();
            if (freshData.video_url && freshData.video_url !== video.src) {
              console.log(`[viewer] Aplicando URL fresca para ${videoId}`);
              const pos = video.currentTime || 0;
              video.src = freshData.video_url;
              if (!freshData.combined_audio && freshData.audio_url !== freshData.video_url) {
                audio.src = freshData.audio_url;
              }
              applyState();
              video.oncanplay = () => {
                video.oncanplay = null;
                if (pos > 1) video.currentTime = pos;
                startVideoPlayback();
              };
              if (video.readyState >= 2) startVideoPlayback();
            }
          } catch(e) {
            console.warn('[viewer] Error en prefetch:', e);
          }
        }, prefetchIn);
      }

    } else {
      console.error("Error al obtener URL del video:", data.error);
      loadingOverlay.classList.remove('active');
    }
  } catch (err) {
    console.error("Fallo de conexión con backend:", err);
    loadingOverlay.classList.remove('active');
  }
}

// ─── WATCHDOG ANTI-CONGELAMIENTO (cada 8s revisa que el video avance) ───
let _lastTime = -1;
let _stallCount = 0;
setInterval(() => {
  if (!currentPlayingId) return;
  if (video.paused || video.ended) return;
  if (loadingOverlay.classList.contains('active')) return;
  const t = video.currentTime;
  if (t === _lastTime) {
    _stallCount++;
    if (_stallCount >= 2) {
      // Video congelado por ~16s — reintentar
      console.warn('[viewer] Video congelado, reintentando...');
      _stallCount = 0;
      _lastTime = -1;
      audioFallbackRequested = false;
      const retryId = currentPlayingId;
      loadingOverlay.classList.add('active');
      fetch(`/api/get_video_url?v=${retryId}&fresh=1&ts=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
          if (data.video_url) {
            const pos = video.currentTime || 0;
            usesCombinedMedia = Boolean(data.combined_audio || data.video_url === data.audio_url);
            video.src = data.video_url;
            if (!usesCombinedMedia && data.audio_url) {
              audio.src = data.audio_url;
            } else {
              audio.removeAttribute('src');
              audio.load();
            }
            applyState();
            video.oncanplay = () => {
              video.oncanplay = null;
              if (pos > 0) video.currentTime = pos;
              loadingOverlay.classList.remove('active');
              startVideoPlayback();
            };
            if (video.readyState >= 2) {
              loadingOverlay.classList.remove('active');
              startVideoPlayback();
            }
          } else {
            loadingOverlay.classList.remove('active');
          }
        })
        .catch(() => { loadingOverlay.classList.remove('active'); });
    }
  } else {
    _stallCount = 0;
    _lastTime = t;
  }
}, 3000);

let autoFocusEnabled = true;

// Cargar preferencia de autofoco desde el backend
fetch('/api/config').then(r => r.json()).then(cfg => {
  if (cfg.auto_focus_viewer !== undefined) autoFocusEnabled = Boolean(cfg.auto_focus_viewer);
  playbackMode = cfg.video_playback_mode || 'original';
}).catch(() => {});

// ─── DOBLE CANAL DE SINCRONIZACIÓN: BROADCASTCHANNEL + SSE ───
// 1. BroadcastChannel (Para pestañas en el mismo navegador local)
const channel = new BroadcastChannel('fondos_stream');

channel.onmessage = (e) => {
  if (e.data?.type === 'play' && e.data.videoId) {
    playVideo(e.data.videoId);
    if (autoFocusEnabled) {
      try { window.focus(); } catch(err) {}
    }
  }
  if (e.data?.type === 'focus_viewer') {
    try { window.focus(); } catch(err) {}
  }
  if (e.data?.type === 'state') {
    if (e.data.playbackRate !== undefined) currentPlaybackRate = e.data.playbackRate;
    if (e.data.muted !== undefined) isMuted = e.data.muted;
    applyState();
  }
};

// 2. Server-Sent Events (SSE) (Para sincronizar con Desktop App y Celular)
function initSSE() {
  const viewerSessionId = 'viewer_' + Math.random().toString(36).substring(2, 10);
  const evtSource = new EventSource('/api/events?client=viewer&id=' + viewerSessionId);

  evtSource.addEventListener('sync_state', (e) => {
    try {
      const payload = JSON.parse(e.data);
      const state = payload.data;
      if (state) {
        if (state.playbackRate !== undefined) currentPlaybackRate = state.playbackRate;
        if (state.muted !== undefined) isMuted = state.muted;
        applyState();
        if (state.videoId && state.videoId !== currentPlayingId) {
          playVideo(state.videoId, state.title);
        }
      }
    } catch(err) {}
  });

  evtSource.addEventListener('play', (e) => {
    try {
      const payload = JSON.parse(e.data);
      if (payload.data?.videoId) {
        playVideo(payload.data.videoId, payload.data.title);
        if (autoFocusEnabled) {
          try { window.focus(); } catch(err) {}
        }
      }
    } catch(err) {}
  });

  evtSource.addEventListener('focus_viewer', () => {
    try {
      window.focus();
    } catch(err) {}
  });

  evtSource.addEventListener('config_updated', (e) => {
    fetch('/api/config').then(r => r.json()).then(cfg => {
      if (cfg.auto_focus_viewer !== undefined) autoFocusEnabled = Boolean(cfg.auto_focus_viewer);
    }).catch(() => {});
  });

  evtSource.addEventListener('state', (e) => {
    try {
      const payload = JSON.parse(e.data);
      if (payload.data) {
        if (payload.data.playbackRate !== undefined) currentPlaybackRate = payload.data.playbackRate;
        if (payload.data.muted !== undefined) isMuted = payload.data.muted;
        applyState();
      }
    } catch(err) {}
  });
}

initSSE();

// Avisar que el Viewer está listo
function notifyReady() {
  channel.postMessage({ type: 'viewer_ready' });
  fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'viewer_ready' })
  }).catch(() => {});
}

notifyReady();
setTimeout(notifyReady, 1500);

// Notificar desconexión al cerrar pestaña

window.addEventListener('beforeunload', () => {
  fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'viewer_closed' }),
    keepalive: true
  }).catch(() => {});
});

// Si el usuario hace click en cualquier parte del visor, aplicar estado y asegurar audio
document.addEventListener('pointerdown', () => {
  applyState();
  if (!usesCombinedMedia && !isMuted && audio.src && audio.paused) {
    audio.play().catch(() => {});
  }
}, { passive: true });

// ─── PANTALLA COMPLETA ───
function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}
</script>
</body>
</html>
