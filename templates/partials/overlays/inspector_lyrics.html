          <div id="paneInspLyrics" class="inspector-pane" style="display:none; flex-direction:column; gap:12px;">
            <div class="inspector-section">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="inspector-section-title">📜 Módulo Letras (Spotify)</span>
                <label style="display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--accent); cursor:pointer;">
                  <input type="checkbox" id="modLyEnabled" checked onchange="updateModularProp('lyrics', 'enabled', this.checked)"> Habilitar Letras
                </label>
              </div>
            </div>

            <div class="inspector-section">
              <span class="inspector-section-title">📐 Ubicación &amp; Tamaño</span>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div>
                  <label class="form-label" style="font-size:11px;">Posición X (px)</label>
                  <input type="number" id="modLyX" class="form-input" min="0" max="1920" step="5" oninput="updateModularProp('lyrics', 'x', parseInt(this.value, 10))">
                </div>
                <div>
                  <label class="form-label" style="font-size:11px;">Posición Y (desde abajo)</label>
                  <input type="number" id="modLyY" class="form-input" min="0" max="1080" step="5" oninput="updateModularProp('lyrics', 'y', parseInt(this.value, 10))">
                </div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div>
                  <label class="form-label" style="font-size:11px;">Escala: <span id="modLyScaleVal" style="color:var(--accent);">1.0x</span></label>
                  <input type="range" id="modLyScale" min="0.5" max="2.0" step="0.05" value="1.0" oninput="updateModularProp('lyrics', 'scale', parseFloat(this.value))" style="width:100%; accent-color:var(--accent);">
                </div>
                <div>
                  <label class="form-label" style="font-size:11px;">Ancho (px)</label>
                  <input type="number" id="modLyWidth" class="form-input" min="260" max="3840" step="10" oninput="updateModularProp('lyrics', 'width', parseInt(this.value, 10))">
                </div>
              </div>
              <div>
                <label class="form-label" style="font-size:11px;">Altura Máxima (px)</label>
                <input type="number" id="modLyMaxHeight" class="form-input" min="80" max="400" step="10" oninput="updateModularProp('lyrics', 'max_height', parseInt(this.value, 10))">
              </div>
            </div>

            <div class="inspector-section">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span class="inspector-section-title" style="margin:0;">📑 Nivel de Capa (Z-Index / Arriba-Abajo)</span>
                <span id="modLyZVal" style="font-weight:800; color:var(--accent); font-size:12px; font-family:'Space Mono',monospace;">15</span>
              </div>
              <div style="display:flex; gap:6px; align-items:center;">
                <button class="btn btn-sm" onclick="changeModuleLayer('lyrics', -5)" title="Enviar hacia atrás">🔽 Bajar</button>
                <input type="number" id="modLyZIndex" class="form-input" style="width:70px; text-align:center; font-weight:700; font-size:12px;" value="15" min="1" max="999" onchange="setModuleLayer('lyrics', this.value)">
                <button class="btn btn-sm btn-accent" onclick="changeModuleLayer('lyrics', 5)" title="Traer hacia adelante">🔼 Subir</button>
                <button class="btn btn-sm" onclick="changeModuleLayer('lyrics', 100)" title="Traer al frente del todo" style="font-size:10px;">🔝 Al Frente</button>
                <button class="btn btn-sm" onclick="changeModuleLayer('lyrics', -100)" title="Enviar al fondo" style="font-size:10px;">⬇️ Al Fondo</button>
              </div>
            </div>

            <div class="inspector-section">
              <span class="inspector-section-title">🔄 Modo de Visualización</span>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div>
                  <label class="form-label" style="font-size:11px;">Modo de Letras</label>
                  <select id="modLyMode" class="form-input" onchange="updateModularProp('lyrics', 'mode', this.value)">
                    <option value="single">Línea Única</option>
                    <option value="scroll">Lista Deslizante</option>
                    <option value="marquee">Marquesina (Der a Izq)</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" style="font-size:11px;">Color Línea Actual (Scroll)</label>
                  <input type="color" id="modLyHighlightColor" class="form-input" style="height:32px; padding:2px;" oninput="updateModularProp('lyrics', 'highlight_color', this.value)">
                </div>
              </div>
            </div>

            <div class="inspector-section">
              <span class="inspector-section-title">🎨 Rectángulo &amp; Tipografía</span>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div>
                  <label class="form-label" style="font-size:11px;">Color Fondo</label>
                  <input type="color" id="modLyBgColor" class="form-input" style="height:32px; padding:2px;" oninput="updateModularProp('lyrics', 'bg_color', this.value)">
                </div>
                <div>
                  <label class="form-label" style="font-size:11px;">Opacidad: <span id="modLyOpVal" style="color:var(--accent);">75%</span></label>
                  <input type="range" id="modLyBgOpacity" min="0" max="100" value="75" oninput="updateModularProp('lyrics', 'bg_opacity', parseInt(this.value, 10))" style="width:100%; accent-color:var(--accent);">
                </div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div>
                  <label class="form-label" style="font-size:11px;">Color Texto</label>
                  <input type="color" id="modLyTextColor" class="form-input" style="height:32px; padding:2px;" oninput="updateModularProp('lyrics', 'text_color', this.value)">
                </div>
                <div>
                  <label class="form-label" style="font-size:11px;">Tamaño Letra (px)</label>
                  <input type="number" id="modLyFontSize" class="form-input" min="10" max="300" value="13" oninput="updateModularProp('lyrics', 'font_size', parseInt(this.value, 10))" title="Usa la ruedita del mouse para ajustar">
                </div>
              </div>
            </div>
          </div>
