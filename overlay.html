<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OBS Stream Overlay — Fondos & Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-card: rgba(10, 10, 10, 0.78);
    --border: rgba(255, 255, 255, 0.08);
    --border-radius: 12px;
    --accent: #e8ff47;
    --accent-glow: rgba(232, 255, 71, 0.35);
    --text: #ffffff;
    --muted: #a0a0a0;
    --spotify: #1DB954;
    --youtube: #ff0033;
    --overlay-scale: 1.0;
    --overlay-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --wave-amp: 0px;
    --wave-speed: 1.8s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: var(--overlay-font);
    color: var(--text);
  }

  /* ─── 1. BARRITA NOW PLAYING FLOTANTE (DISCRETA POR DEFAULT) ─── */
  .now-playing-container {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: var(--border-radius);
    padding: 8px 14px 8px 10px;
    max-width: 480px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateY(16px) scale(var(--overlay-scale));
    transform-origin: bottom left;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s, border-color 0.3s;
    pointer-events: none;
    font-family: var(--overlay-font);
  }
  .now-playing-container.visible {
    opacity: 1;
    transform: translateY(0) scale(var(--overlay-scale));
  }

  .np-cover {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    object-fit: cover;
    background: #141414;
    border: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }

  .np-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .np-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .np-badge.spotify { color: var(--spotify); }
  .np-badge.youtube { color: var(--youtube); }

  .np-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
    line-height: 1.3;
  }

  .np-subtitle {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
    line-height: 1.2;
  }

  .np-extra-text {
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }

  /* Animación de Ondulación / Wave */
  @keyframes textWaveAnim {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    25% { transform: translateY(calc(var(--wave-amp) * -1)) rotate(-0.6deg); }
    75% { transform: translateY(var(--wave-amp)) rotate(0.6deg); }
  }
  .wave-active {
    display: inline-block;
    animation: textWaveAnim var(--wave-speed) ease-in-out infinite;
  }

  /* Ecualizador animado */
  .np-eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    margin-left: 4px;
  }
  .np-eq-bar {
    width: 2.5px;
    background: currentColor;
    border-radius: 2px;
    animation: eqBounce 1s infinite ease-in-out;
  }
  .np-eq-bar:nth-child(1) { height: 5px; animation-delay: 0.1s; }
  .np-eq-bar:nth-child(2) { height: 12px; animation-delay: 0.3s; }
  .np-eq-bar:nth-child(3) { height: 8px; animation-delay: 0.2s; }

  @keyframes eqBounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* ─── 2. LETRAS / LYRICS SPOTIFY ─── */
  .lyrics-container {
    position: fixed;
    bottom: 95px;
    left: 28px;
    width: 440px;
    max-height: 150px;
    overflow: hidden;
    background: var(--bg-card);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: var(--border-radius);
    padding: 12px 16px;
    opacity: 0;
    transform: translateY(12px) scale(var(--overlay-scale));
    transform-origin: bottom left;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
    font-family: var(--overlay-font);
  }
  .lyrics-container.visible {
    opacity: 1;
    transform: translateY(0) scale(var(--overlay-scale));
  }
  .lyrics-text {
    font-size: 13px;
    line-height: 1.5;
    color: #e0e0e0;
    font-weight: 700;
    white-space: pre-wrap;
    text-align: left;
    transform: translateY(0);
    transition: transform 1s ease;
  }

  /* ─── 3. TEMPORIZADOR "YA VUELVO / RECREO" ─── */
  .break-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .break-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .break-card {
    background: var(--bg-card);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
    border: 2px solid var(--accent);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 28px var(--accent-glow);
    border-radius: calc(var(--border-radius) * 1.8);
    padding: 32px 44px;
    max-width: 640px;
    width: 90%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transform: scale(0.92);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: var(--overlay-font);
  }
  .break-overlay.visible .break-card {
    transform: scale(1);
  }

  .break-header-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232, 255, 71, 0.12);
    border: 1px solid var(--accent);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
  }

  .break-title {
    font-family: 'Syne', sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
  }

  .break-timer {
    font-family: 'Space Mono', monospace;
    font-size: 72px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -2px;
    text-shadow: 0 0 24px var(--accent-glow);
    margin: 2px 0;
  }
  .break-timer.finished {
    color: #ff4757;
    text-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
    animation: flashTimer 1s infinite alternate;
  }

  @keyframes flashTimer {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.04); opacity: 0.7; }
  }

  .break-progress-track {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .break-progress-bar {
    height: 100%;
    background: var(--accent);
    width: 100%;
    transition: width 0.4s linear;
    box-shadow: 0 0 10px var(--accent);
  }

  .break-phrase-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px dashed rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 12px 18px;
    width: 100%;
    font-size: 14px;
    color: #d0d0d0;
    font-style: italic;
    font-family: 'Space Mono', monospace;
    line-height: 1.4;
  }
  .break-phrase-box span {
    color: var(--accent);
    font-weight: 700;
  }
</style>
</head>
<body>

<!-- ─── 1. BARRITA NOW PLAYING (SPOTIFY / YOUTUBE) ─── -->
<div class="now-playing-container" id="nowPlayingContainer">
  <img class="np-cover" id="npCover" src="" alt="Cover" />
  <div class="np-info">
    <div class="np-badge" id="npBadge">
      <span id="npSourceIcon">🎵</span>
      <span id="npSourceText">REPRODUCIENDO</span>
      <div class="np-eq">
        <div class="np-eq-bar"></div>
        <div class="np-eq-bar"></div>
        <div class="np-eq-bar"></div>
      </div>
    </div>
    <div class="np-title" id="npTitle">Cargando...</div>
    <div class="np-subtitle" id="npSubtitle">Artista / Canal</div>
    <div class="np-extra-text" id="npExtraText"></div>
  </div>
</div>


<div class="lyrics-container" id="lyricsContainer">
  <div class="lyrics-text" id="lyricsText"></div>
</div>

<!-- ─── 2. OVERLAY TEMPORIZADOR "YA VUELVO / RECREO" ─── -->
<div class="break-overlay" id="breakOverlay">
  <div class="break-card">
    <div class="break-header-pill">
      <span>⏱️</span> PAUSA DE STREAM &amp; CLASE
    </div>

    <div class="break-title" id="breakTitleText">Ya vuelvo</div>

    <div class="break-timer" id="breakTimerText">05:00</div>

    <div class="break-progress-track">
      <div class="break-progress-bar" id="breakProgressBar"></div>
    </div>

    <div class="break-phrase-box" id="breakPhraseBox">
      “<span id="breakPhraseText">Compilando cerebro... (42 warnings, 0 errors)</span>”
    </div>
  </div>
</div>

<script>
  let overlayConfig = {
    overlay_enabled: true,
    overlay_show_song_title: true,
    overlay_show_video_title: true,
    overlay_show_artist: true,
    overlay_show_badge: true,
    overlay_show_cover: true,
    overlay_show_equalizer: true,
    overlay_show_lyrics: true,
    overlay_require_focus: false,
    overlay_extra_text: '',
    overlay_position: 'bottom-left',
    overlay_pos_x: 28,
    overlay_pos_y: 28,
    overlay_scale: 1.0,
    overlay_font_family: 'system-ui',
    overlay_text_wave: 0,
    overlay_bg_color: '#0a0a0a',
    overlay_bg_opacity: 78,
    overlay_border_color: 'rgba(255, 255, 255, 0.08)',
    overlay_border_radius: 12,
    overlay_text_color: '#ffffff'
  };

  let currentTimerState = { active: false, running: false, remaining_seconds: 300, total_seconds: 300 };
  let currentSpotify = { is_playing: false, title: '', artist: '', cover_url: '' };
  let currentYouTube = { is_playing: false, title: '', video_id: '' };
  let lastChimePlayedFor = 0;
  let viewerFocused = true;
  let currentLyrics = "";
  let lastLyricsQuery = "";
  let lyricsInterval = null;
  let lyricsOffset = 0;

  function hexToRgba(hex, alpha) {
    if (!hex) return `rgba(10, 10, 10, ${alpha})`;
    if (hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const r = parseInt(hex.substring(0, 2), 16) || 10;
    const g = parseInt(hex.substring(2, 4), 16) || 10;
    const b = parseInt(hex.substring(4, 6), 16) || 10;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function applyConfigToOverlay(cfg) {
    if (!cfg) return;
    overlayConfig = Object.assign({}, overlayConfig, cfg);

    const root = document.documentElement;
    const container = document.getElementById('nowPlayingContainer');
    const lyricsEl = document.getElementById('lyricsContainer');

    // 1. Escala
    const scale = parseFloat(overlayConfig.overlay_scale || 1.0);
    root.style.setProperty('--overlay-scale', scale);

    // 2. Tipografía
    const font = overlayConfig.overlay_font_family || 'system-ui';
    root.style.setProperty('--overlay-font', font);

    // 3. Colores y transparencia (Discreto por default)
    const bgColor = overlayConfig.overlay_bg_color || '#0a0a0a';
    const bgOpacity = (overlayConfig.overlay_bg_opacity !== undefined ? overlayConfig.overlay_bg_opacity : 78) / 100;
    const rgbaBg = hexToRgba(bgColor, bgOpacity);
    root.style.setProperty('--bg-card', rgbaBg);

    const borderColor = overlayConfig.overlay_border_color || 'rgba(255, 255, 255, 0.08)';
    root.style.setProperty('--border', borderColor);

    const radius = (overlayConfig.overlay_border_radius !== undefined ? overlayConfig.overlay_border_radius : 12) + 'px';
    root.style.setProperty('--border-radius', radius);

    const textColor = overlayConfig.overlay_text_color || '#ffffff';
    root.style.setProperty('--text', textColor);

    // 4. Posición y Coordenadas X/Y
    const posX = (overlayConfig.overlay_pos_x !== undefined ? overlayConfig.overlay_pos_x : 28) + 'px';
    const posY = (overlayConfig.overlay_pos_y !== undefined ? overlayConfig.overlay_pos_y : 28) + 'px';
    const pos = overlayConfig.overlay_position || 'bottom-left';

    [container, lyricsEl].forEach(el => {
      if (!el) return;
      el.style.top = '';
      el.style.bottom = '';
      el.style.left = '';
      el.style.right = '';
      el.style.transformOrigin = '';

      if (pos === 'bottom-left') {
        el.style.bottom = posY;
        el.style.left = posX;
        el.style.transformOrigin = 'bottom left';
      } else if (pos === 'bottom-right') {
        el.style.bottom = posY;
        el.style.right = posX;
        el.style.transformOrigin = 'bottom right';
      } else if (pos === 'top-left') {
        el.style.top = posY;
        el.style.left = posX;
        el.style.transformOrigin = 'top left';
      } else if (pos === 'top-right') {
        el.style.top = posY;
        el.style.right = posX;
        el.style.transformOrigin = 'top right';
      } else if (pos === 'bottom-center') {
        el.style.bottom = posY;
        el.style.left = '50%';
        el.style.transformOrigin = 'bottom center';
        el.style.marginLeft = el === lyricsEl ? '-220px' : '-200px';
      } else if (pos === 'top-center') {
        el.style.top = posY;
        el.style.left = '50%';
        el.style.transformOrigin = 'top center';
        el.style.marginLeft = el === lyricsEl ? '-220px' : '-200px';
      }
    });

    if (lyricsEl) {
      // Ajustar letras para que no se superpongan a la barrita
      const offsetAbove = 70 * scale;
      if (pos.startsWith('bottom')) {
        lyricsEl.style.bottom = `calc(${posY} + ${offsetAbove}px)`;
      } else {
        lyricsEl.style.top = `calc(${posY} + ${offsetAbove}px)`;
      }
    }

    // 5. Onda / Ondulación en el texto
    const wave = parseInt(overlayConfig.overlay_text_wave || 0, 10);
    const titleEl = document.getElementById('npTitle');
    if (wave > 0) {
      const amp = (wave * 0.9) + 'px';
      const spd = Math.max(0.6, 2.6 - (wave * 0.18)) + 's';
      root.style.setProperty('--wave-amp', amp);
      root.style.setProperty('--wave-speed', spd);
      if (titleEl) titleEl.classList.add('wave-active');
    } else {
      root.style.setProperty('--wave-amp', '0px');
      if (titleEl) titleEl.classList.remove('wave-active');
    }

    // 6. Texto extra personalizado
    const extraEl = document.getElementById('npExtraText');
    if (extraEl) {
      if (overlayConfig.overlay_extra_text && overlayConfig.overlay_extra_text.trim()) {
        extraEl.textContent = overlayConfig.overlay_extra_text.trim();
        extraEl.style.display = 'block';
      } else {
        extraEl.style.display = 'none';
      }
    }

    // 7. Visibilidad de elementos individuales
    const badgeEl = document.getElementById('npBadge');
    if (badgeEl) badgeEl.style.display = (overlayConfig.overlay_show_badge !== false) ? 'flex' : 'none';

    const subEl = document.getElementById('npSubtitle');
    if (subEl) subEl.style.display = (overlayConfig.overlay_show_artist !== false) ? 'block' : 'none';

    const coverEl = document.getElementById('npCover');
    if (coverEl) coverEl.style.display = (overlayConfig.overlay_show_cover !== false) ? 'block' : 'none';

    const eqEl = document.querySelector('.np-eq');
    if (eqEl) eqEl.style.display = (overlayConfig.overlay_show_equalizer !== false) ? 'flex' : 'none';

    updateNowPlayingUI();
    fetchAndUpdateLyrics();
  }

  // Audio chime
  function playSchoolBellChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const startTime = ctx.currentTime + (idx * 0.22);
        gain.gain.setValueAtTime(0.01, startTime);
        gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.85);
      });
    } catch(e) {}
  }

  function updateTimerUI(data) {
    if (!data) return;
    currentTimerState = data;
    const overlay = document.getElementById('breakOverlay');
    const timerText = document.getElementById('breakTimerText');
    const titleText = document.getElementById('breakTitleText');
    const phraseText = document.getElementById('breakPhraseText');
    const bar = document.getElementById('breakProgressBar');

    if (!data.active || overlayConfig.overlay_enabled === false) {
      overlay.classList.remove('visible');
      timerText.classList.remove('finished');
      return;
    }

    overlay.classList.add('visible');
    const rem = Math.max(0, data.remaining_seconds || 0);
    const m = Math.floor(rem / 60);
    const s = rem % 60;
    timerText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

    if (data.title) titleText.textContent = data.title;
    if (data.phrase) phraseText.textContent = data.phrase;

    const total = data.total_seconds || 300;
    const pct = Math.max(0, Math.min(100, (rem / total) * 100));
    bar.style.width = pct + '%';

    if (rem <= 0) {
      timerText.classList.add('finished');
      timerText.textContent = '00:00';
      bar.style.width = '0%';
      const now = Date.now();
      if (data.play_sound && (now - lastChimePlayedFor > 8000)) {
        lastChimePlayedFor = now;
        playSchoolBellChime();
      }
    } else {
      timerText.classList.remove('finished');
    }
  }

  function updateNowPlayingUI() {
    const container = document.getElementById('nowPlayingContainer');
    const lyricsEl = document.getElementById('lyricsContainer');
    const cover = document.getElementById('npCover');
    const badge = document.getElementById('npBadge');
    const icon = document.getElementById('npSourceIcon');
    const sourceText = document.getElementById('npSourceText');
    const title = document.getElementById('npTitle');
    const sub = document.getElementById('npSubtitle');

    if (overlayConfig.overlay_enabled === false) {
      container.classList.remove('visible');
      if (lyricsEl) lyricsEl.classList.remove('visible');
      return;
    }

    // 1. Spotify
    if (currentSpotify && currentSpotify.is_playing && currentSpotify.title) {
      container.classList.add('visible');
      badge.className = 'np-badge spotify';
      icon.textContent = '🎵';
      sourceText.textContent = 'SPOTIFY';

      title.style.display = (overlayConfig.overlay_show_song_title !== false) ? 'block' : 'none';
      title.textContent = currentSpotify.title;

      sub.style.display = (overlayConfig.overlay_show_artist !== false) ? 'block' : 'none';
      sub.textContent = currentSpotify.artist || 'Música en PC';

      if (overlayConfig.overlay_show_cover !== false) {
        cover.src = currentSpotify.cover_url || '/assets/icon.png';
        cover.style.display = 'block';
      } else {
        cover.style.display = 'none';
      }
      return;
    }

    // 2. YouTube
    if (currentYouTube && currentYouTube.is_playing && currentYouTube.title) {
      if (overlayConfig.overlay_require_focus && !viewerFocused) {
        container.classList.remove('visible');
        if (lyricsEl) lyricsEl.classList.remove('visible');
        return;
      }

      container.classList.add('visible');
      badge.className = 'np-badge youtube';
      icon.textContent = '▶️';
      sourceText.textContent = 'FONDO / STREAM';

      title.style.display = (overlayConfig.overlay_show_video_title !== false) ? 'block' : 'none';
      title.textContent = currentYouTube.title;

      sub.style.display = (overlayConfig.overlay_show_artist !== false) ? 'block' : 'none';
      sub.textContent = 'YouTube Stream';

      if (overlayConfig.overlay_show_cover !== false && currentYouTube.video_id) {
        cover.src = `https://img.youtube.com/vi/${currentYouTube.video_id}/mqdefault.jpg`;
        cover.style.display = 'block';
      } else {
        cover.style.display = 'none';
      }
      return;
    }

    // 3. Ocultar si no hay nada
    container.classList.remove('visible');
    if (lyricsEl) lyricsEl.classList.remove('visible');
  }

  async function fetchAndUpdateLyrics() {
    const lyricsEl = document.getElementById('lyricsContainer');
    if (!lyricsEl) return;

    if (overlayConfig.overlay_enabled === false || overlayConfig.overlay_show_lyrics === false || !currentSpotify.is_playing || !currentSpotify.title) {
      lyricsEl.classList.remove('visible');
      return;
    }

    const query = (currentSpotify.artist || '') + ' - ' + (currentSpotify.title || '');
    if (query === lastLyricsQuery && currentLyrics) {
      lyricsEl.classList.add('visible');
      return;
    }

    lastLyricsQuery = query;
    currentLyrics = '';
    lyricsEl.classList.remove('visible');

    try {
      const art = encodeURIComponent((currentSpotify.artist || '').split(',')[0].trim());
      const tit = encodeURIComponent((currentSpotify.title || '').replace(/\(.*\)/g, '').trim());
      const res = await fetch(`/api/spotify/lyrics?artist=${art}&title=${tit}`);
      const data = await res.json();
      if (data.lyrics && data.lyrics.trim()) {
        currentLyrics = data.lyrics.trim();
        const lt = document.getElementById('lyricsText');
        lt.textContent = currentLyrics;
        lt.style.transform = 'translateY(0)';
        lyricsEl.classList.add('visible');

        clearInterval(lyricsInterval);
        lyricsOffset = 0;
        lyricsInterval = setInterval(() => {
          lyricsOffset -= 14;
          if (Math.abs(lyricsOffset) > lt.scrollHeight) lyricsOffset = 0;
          lt.style.transform = `translateY(${lyricsOffset}px)`;
        }, 2200);
      }
    } catch(e) {}
  }

  function initSSE() {
    const evtSource = new EventSource('/api/events');

    evtSource.addEventListener('config_updated', (e) => {
      try {
        const d = JSON.parse(e.data).data;
        applyConfigToOverlay(d);
      } catch(err) {}
    });

    evtSource.addEventListener('timer_update', (e) => {
      try { updateTimerUI(JSON.parse(e.data).data); } catch(err) {}
    });

    evtSource.addEventListener('timer_finished', (e) => {
      try {
        const d = JSON.parse(e.data).data;
        updateTimerUI(d);
        playSchoolBellChime();
      } catch(err) {}
    });

    evtSource.addEventListener('spotify_state', (e) => {
      try {
        currentSpotify = JSON.parse(e.data).data || {};
        updateNowPlayingUI();
        fetchAndUpdateLyrics();
      } catch(err) {}
    });

    evtSource.addEventListener('state', (e) => {
      try {
        const d = JSON.parse(e.data).data || {};
        currentYouTube.is_playing = (d.status === 'playing');
        if (d.title) currentYouTube.title = d.title;
        if (d.videoId) currentYouTube.video_id = d.videoId;
        updateNowPlayingUI();
      } catch(err) {}
    });

    evtSource.addEventListener('play', (e) => {
      try {
        const d = JSON.parse(e.data).data || {};
        currentYouTube.is_playing = true;
        if (d.title) currentYouTube.title = d.title;
        if (d.videoId) currentYouTube.video_id = d.videoId;
        updateNowPlayingUI();
      } catch(err) {}
    });

    evtSource.addEventListener('pause', () => {
      currentYouTube.is_playing = false;
      updateNowPlayingUI();
    });

    evtSource.addEventListener('viewer_focus', () => {
      viewerFocused = true;
      updateNowPlayingUI();
    });

    evtSource.addEventListener('viewer_blur', () => {
      viewerFocused = false;
      updateNowPlayingUI();
    });

    evtSource.onerror = () => {
      setTimeout(initSSE, 3000);
    };
  }

  async function fetchInitialState() {
    try {
      const resC = await fetch('/api/config');
      const dataC = await resC.json();
      applyConfigToOverlay(dataC);
    } catch(e) {}

    try {
      const resT = await fetch('/api/timer/status');
      const dataT = await resT.json();
      updateTimerUI(dataT);
    } catch(e) {}

    try {
      const resS = await fetch('/api/state');
      const dataS = await resS.json();
      currentYouTube.is_playing = (dataS.status === 'playing');
      currentYouTube.title = dataS.title || '';
      currentYouTube.video_id = dataS.videoId || '';
      updateNowPlayingUI();
    } catch(e) {}
  }

  document.addEventListener('DOMContentLoaded', () => {
    fetchInitialState();
    initSSE();
  });

</script>

</body>
</html>
