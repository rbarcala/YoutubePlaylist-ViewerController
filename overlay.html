<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OBS Stream Overlay — Fondos & Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-card: rgba(10, 10, 10, 0.78);
    --border: rgba(255, 255, 255, 0.08);
    --border-radius: 12px;
    --accent: #e8ff47;
    --accent-glow: rgba(232, 255, 71, 0.35);
    --text: #ffffff;
    --muted: #a0a0a0;
    --spotify: #1DB954;
    --youtube: #ff0033;
    --overlay-scale: 1.0;
    --overlay-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --wave-amp: 0px;
    --wave-speed: 1.8s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: var(--overlay-font);
    color: var(--text);
  }

  /* ─── 1. BARRITA NOW PLAYING FLOTANTE (DISCRETA POR DEFAULT) ─── */
  .now-playing-container {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--border-radius);
    padding: 8px 14px 8px 10px;
    max-width: 480px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateY(16px) scale(var(--overlay-scale));
    transform-origin: bottom left;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s, border-color 0.3s;
    pointer-events: none;
    font-family: var(--overlay-font);
  }
  .now-playing-container.visible {
    opacity: 1;
    transform: translateY(0) scale(var(--overlay-scale));
  }

  .np-cover {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    object-fit: cover;
    background: #141414;
    border: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }

  .np-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .np-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .np-badge.spotify { color: var(--spotify); }
  .np-badge.youtube { color: var(--youtube); }

  .np-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
    line-height: 1.3;
  }

  .np-subtitle {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
    line-height: 1.2;
  }

  .np-extra-text {
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }

  /* Animación de Ondulación / Wave */
  @keyframes textWaveAnim {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    25% { transform: translateY(calc(var(--wave-amp) * -1)) rotate(-0.6deg); }
    75% { transform: translateY(var(--wave-amp)) rotate(0.6deg); }
  }
  .wave-active {
    display: inline-block;
    animation: textWaveAnim var(--wave-speed) ease-in-out infinite;
  }

  /* Ecualizador animado */
  .np-eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    margin-left: 4px;
  }
  .np-eq-bar {
    width: 2.5px;
    background: currentColor;
    border-radius: 2px;
    animation: eqBounce 1s infinite ease-in-out;
  }
  .np-eq-bar:nth-child(1) { height: 5px; animation-delay: 0.1s; }
  .np-eq-bar:nth-child(2) { height: 12px; animation-delay: 0.3s; }
  .np-eq-bar:nth-child(3) { height: 8px; animation-delay: 0.2s; }

  @keyframes eqBounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* ─── 2. LETRAS / LYRICS SPOTIFY ─── */
  .lyrics-container {
    position: fixed;
    bottom: 95px;
    left: 28px;
    width: 440px;
    max-height: 150px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--border-radius);
    padding: 12px 16px;
    opacity: 0;
    transform: translateY(12px) scale(var(--overlay-scale));
    transform-origin: bottom left;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
    font-family: var(--overlay-font);
    z-index: 120;
  }
  .lyrics-container.visible {
    opacity: 1;
    transform: translateY(0) scale(var(--overlay-scale));
  }
  .lyrics-text {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    color: #e0e0e0;
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    position: relative;
    width: 100%;
    white-space: pre-wrap;
  }
  .lyric-line {
    padding: 6px 0;
    transition: all 0.3s ease;
    opacity: 0.4;
  }
  .lyric-line.active {
    opacity: 1;
    transform: scale(1.03);
  }
  .lyrics-text.mode-marquee {
    display: flex;
    flex-direction: row;
    gap: 60px;
    align-items: center;
    white-space: nowrap;
    width: max-content;
  }
  .lyric-line-h {
    transition: all 0.3s ease;
    opacity: 0.4;
  }
  .lyric-line-h.active {
    opacity: 1;
    transform: scale(1.05);
  }
  @keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ─── 3. TEMPORIZADOR "YA VUELVO / RECREO" ─── */
  .break-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .break-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .break-card {
    position: absolute;
    left: var(--timer-x, 50%);
    top: var(--timer-y, 50%);
    transform: translate(-50%, -50%) scale(var(--timer-scale, 1));
    transform-origin: center center;
    background: var(--timer-bg, var(--bg-card));
    border: 2px solid var(--timer-border, var(--accent));
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 28px var(--accent-glow);
    border-radius: var(--timer-radius, calc(var(--border-radius) * 1.8));
    padding: 32px 44px;
    width: var(--timer-width, 560px);
    max-width: 92vw;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s, border-color 0.3s;
    font-family: var(--timer-font, var(--overlay-font));
  }
  .break-overlay.visible .break-card {
    transform: translate(-50%, -50%) scale(var(--timer-scale, 1));
  }

  .break-header-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(232, 255, 71, 0.12);
    border: 1px solid var(--accent);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-family: 'Space Mono', monospace;
  }

  /* ─── 4. TEXTOS PERSONALIZADOS MODULARES ─── */
  .overlay-custom-text {
    position: absolute;
    display: inline-flex;
    align-items: center;
    pointer-events: none;
    white-space: pre-wrap;
    box-sizing: border-box;
    transition: transform 0.3s ease;
    word-break: break-word;
  }
  .overlay-custom-text.wave {
    animation: customTextWave 2.4s ease-in-out infinite;
  }
  .overlay-custom-text.pulse {
    animation: customTextPulse 1.8s ease-in-out infinite;
  }
  .overlay-custom-text.marquee {
    overflow: hidden;
    white-space: nowrap;
  }
  @keyframes customTextWave {
    0%, 100% { transform: scale(var(--scale, 1)) translateY(0); }
    50% { transform: scale(var(--scale, 1)) translateY(-8px); }
  }
  @keyframes customTextPulse {
    0%, 100% { opacity: 0.92; transform: scale(var(--scale, 1)); }
    50% { opacity: 1; transform: scale(calc(var(--scale, 1) * 1.05)); filter: brightness(1.25); }
  }

  .break-title {
    font-family: 'Syne', sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
  }

  .break-timer {
    font-family: 'Space Mono', monospace;
    font-size: 72px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -2px;
    text-shadow: 0 0 24px var(--accent-glow);
    margin: 2px 0;
  }
  .break-timer.finished {
    color: #ff4757;
    text-shadow: 0 0 30px rgba(255, 71, 87, 0.6);
    animation: flashTimer 1s infinite alternate;
  }

  @keyframes flashTimer {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.04); opacity: 0.7; }
  }

  .break-progress-track {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .break-progress-bar {
    height: 100%;
    background: var(--accent);
    width: 100%;
    transition: width 0.4s linear;
    box-shadow: 0 0 10px var(--accent);
  }

  .break-phrase-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px dashed rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 12px 18px;
    width: 100%;
    font-size: 14px;
    color: #d0d0d0;
    font-style: italic;
    font-family: 'Space Mono', monospace;
    line-height: 1.4;
  }
  .break-phrase-box span {
    color: var(--accent);
    font-weight: 700;
  }
</style>
</head>
<body>

<!-- ─── 1. BARRITA NOW PLAYING (SPOTIFY / YOUTUBE) ─── -->
<div class="now-playing-container" id="nowPlayingContainer">
  <img class="np-cover" id="npCover" src="" alt="Cover" />
  <div class="np-info">
    <div class="np-badge" id="npBadge">
      <span id="npSourceIcon">🎵</span>
      <span id="npSourceText">REPRODUCIENDO</span>
      <div class="np-eq">
        <div class="np-eq-bar"></div>
        <div class="np-eq-bar"></div>
        <div class="np-eq-bar"></div>
      </div>
    </div>
    <div class="np-title" id="npTitle">Cargando...</div>
    <div class="np-subtitle" id="npSubtitle">Artista / Canal</div>
    <div class="np-extra-text" id="npExtraText"></div>
  </div>
</div>


<div class="lyrics-container" id="lyricsContainer">
  <div class="lyrics-text" id="lyricsText"></div>
</div>

<!-- ─── 2. OVERLAY TEMPORIZADOR "YA VUELVO / RECREO" ─── -->
<div class="break-overlay" id="breakOverlay">
  <div class="break-card" id="breakCard">
    <img id="breakTimerImage" src="" style="position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); display:none; pointer-events:none; z-index:-1; object-fit:contain;">
    <div class="break-header-pill" id="breakHeaderPill">
      <span>⏱️</span> <span id="breakBadgeText">PAUSA DE STREAM &amp; CLASE</span>
    </div>

    <div class="break-title" id="breakTitleText">Ya vuelvo</div>

    <div class="break-timer" id="breakTimerText">05:00</div>

    <div class="break-progress-track" id="breakProgressTrack">
      <div class="break-progress-bar" id="breakProgressBar"></div>
    </div>

    <div class="break-phrase-box" id="breakPhraseBox">
      “<span id="breakPhraseText">Compilando cerebro... (42 warnings, 0 errors)</span>”
    </div>
  </div>
</div>

<!-- ─── 3. TEXTOS PERSONALIZADOS Y MARQUESINAS ─── -->
<div id="customTextsContainer" style="display:contents;"></div>

<script>
  let overlayConfig = {
    overlay_enabled: true,
    overlay_timer_enabled: true,
    overlay_now_playing_enabled: true,
    overlay_show_idle: false,
    overlay_show_song_title: true,
    overlay_show_artist: true,
    overlay_show_badge: true,
    overlay_show_cover: true,
    overlay_show_equalizer: true,
    overlay_show_lyrics: true,
    overlay_extra_text: '',
    overlay_position: 'bottom-left',
    overlay_pos_x: 28,
    overlay_pos_y: 28,
    overlay_scale: 1.0,
    overlay_font_family: 'system-ui',
    overlay_text_wave: 0,
    overlay_bg_color: '#0a0a0a',
    overlay_bg_opacity: 78,
    overlay_border_color: 'rgba(255, 255, 255, 0.08)',
    overlay_border_radius: 12,
    overlay_text_color: '#ffffff'
  };

  let currentTimerState = { active: false, running: false, remaining_seconds: 300, total_seconds: 300 };
  let currentSpotify = { is_playing: false, title: '', artist: '', cover_url: '' };
  let lastChimePlayedFor = 0;
  let currentLyrics = "";
  let currentSyncedLyrics = [];
  let lastLyricsQuery = "";
  let lyricsInterval = null;
  let lyricsOffset = 0;
  
  // Interpolacion local para que las letras sincronizadas se actualicen suavemente cada segundo
  setInterval(() => {
    if (currentSpotify && currentSpotify.is_playing && currentSpotify.progress_ms !== undefined) {
      currentSpotify.progress_ms += 200; // 5 FPS
      if (currentSyncedLyrics && currentSyncedLyrics.length) {
        updateSyncedLyrics(currentSpotify.progress_ms);
      }
    }
  }, 200);

  function parseSyncedLyrics(raw) {
    return String(raw || '').split('\n').flatMap(line => {
      const matches = [...line.matchAll(/\[(\d+):(\d{2})(?:\.(\d{2,3}))?\]\s*(.*)/g)];
      return matches.map(match => ({
        time: (parseInt(match[1], 10) * 60 + parseInt(match[2], 10)) * 1000 + parseInt((match[3] || '0').padEnd(3, '0'), 10),
        text: match[4].trim()
      })).filter(item => item.text);
    }).sort((a, b) => a.time - b.time);
  }

  function updateSyncedLyrics(progressMs) {
    if (!currentSyncedLyrics.length || progressMs === undefined) return false;
    
    const lyricsText = document.getElementById('lyricsText');
    const lyricsEl = document.getElementById('lyricsContainer');
    const mode = overlayConfig.overlay_lyrics_mode || 'single';
    const hlColor = overlayConfig.overlay_lyrics_highlight_color || '#e8ff47';

    let activeIdx = -1;
    for (let i = 0; i < currentSyncedLyrics.length; i++) {
      if (currentSyncedLyrics[i].time > progressMs) break;
      activeIdx = i;
    }

    if (activeIdx === -1) {
      if (mode === 'single') {
        if (lyricsText) {
          lyricsText.className = 'lyrics-text';
          lyricsText.textContent = '';
          lyricsText.style.transform = 'translateY(0px)';
        }
      } else if (mode === 'marquee') {
        if (lyricsText) {
          lyricsText.className = 'lyrics-text mode-marquee';
          lyricsText.style.transform = 'translateX(0px)';
          Array.from(lyricsText.children).forEach(c => {
             c.classList.remove('active');
             c.style.color = '';
             c.style.opacity = '0.4';
          });
        }
      } else {
        if (lyricsText) {
          lyricsText.className = 'lyrics-text';
          lyricsText.style.transform = `translateY(0px)`;
          Array.from(lyricsText.children).forEach(c => {
             c.classList.remove('active');
             c.style.color = '';
             c.style.opacity = '0.4';
          });
        }
      }
      return true;
    }

    const activeCue = currentSyncedLyrics[activeIdx];

    if (mode === 'single') {
      if (lyricsText) {
        lyricsText.className = 'lyrics-text';
        lyricsText.textContent = activeCue.text;
        lyricsText.style.transform = 'translateY(0px)';
        lyricsText.style.overflow = 'visible';
        lyricsText.style.whiteSpace = 'normal';
      }
    } else if (mode === 'marquee') {
      if (lyricsText) {
        if (lyricsText.children.length !== currentSyncedLyrics.length || !lyricsText.classList.contains('mode-marquee')) {
          lyricsText.innerHTML = currentSyncedLyrics.map((c, i) => `<div class="lyric-line-h" id="lyr-${i}">${c.text}</div>`).join('');
          lyricsText.className = 'lyrics-text mode-marquee';
          lyricsText.style.transform = 'translateX(0px)';
          lyricsText.style.overflow = 'visible';
        }
        
        const lines = Array.from(lyricsText.children);
        let activeEl = null;
        lines.forEach((line, i) => {
          if (i === activeIdx) {
            line.classList.add('active');
            line.style.color = hlColor;
            line.style.opacity = '1';
            activeEl = line;
          } else {
            line.classList.remove('active');
            line.style.color = '';
            line.style.opacity = '0.4';
          }
        });

        if (activeEl && lyricsEl) {
          const containerWidth = lyricsEl.offsetWidth;
          let currentPos = activeEl.offsetLeft + activeEl.offsetWidth / 2;
          let nextPos = currentPos;
          let timeDiff = 0;
          let timeElapsed = 0;
          
          if (activeIdx < lines.length - 1) {
             const nextEl = lines[activeIdx + 1];
             nextPos = nextEl.offsetLeft + nextEl.offsetWidth / 2;
             timeDiff = currentSyncedLyrics[activeIdx + 1].time - activeCue.time;
             timeElapsed = progressMs - activeCue.time;
          }
          
          let interpolatedPos = currentPos;
          if (timeDiff > 0 && timeElapsed >= 0) {
             let ratio = timeElapsed / timeDiff;
             if (ratio > 1) ratio = 1;
             interpolatedPos = currentPos + (nextPos - currentPos) * ratio;
          }
          
          const offset = (containerWidth / 2) - interpolatedPos;
          lyricsText.style.transition = 'transform 0.2s linear';
          lyricsText.style.transform = `translateX(${offset}px)`;
        }
      }
    } else {
      if (lyricsText) {
        lyricsText.className = 'lyrics-text';
        lyricsText.style.overflow = 'visible';
        lyricsText.style.whiteSpace = 'normal';
        if (lyricsText.children.length !== currentSyncedLyrics.length || !lyricsText.children[0].classList.contains('lyric-line')) {
          lyricsText.innerHTML = currentSyncedLyrics.map((c, i) => `<div class="lyric-line" id="lyr-${i}">${c.text}</div>`).join('');
        }
        
        const lines = Array.from(lyricsText.children);
        let activeEl = null;
        lines.forEach((line, i) => {
          if (i === activeIdx) {
            line.classList.add('active');
            line.style.color = hlColor;
            line.style.opacity = '1';
            activeEl = line;
          } else {
            line.classList.remove('active');
            line.style.color = '';
            line.style.opacity = '0.4';
          }
        });

        if (activeEl && lyricsEl) {
          const containerHeight = lyricsEl.offsetHeight;
          let currentPos = activeEl.offsetTop + activeEl.offsetHeight / 2;
          let nextPos = currentPos;
          let timeDiff = 0;
          let timeElapsed = 0;
          
          if (activeIdx < lines.length - 1) {
             const nextEl = lines[activeIdx + 1];
             nextPos = nextEl.offsetTop + nextEl.offsetHeight / 2;
             timeDiff = currentSyncedLyrics[activeIdx + 1].time - activeCue.time;
             timeElapsed = progressMs - activeCue.time;
          }
          
          let interpolatedPos = currentPos;
          if (timeDiff > 0 && timeElapsed >= 0) {
             // Instead of constant scroll, let's ease it so it rests on the line, then scrolls
             // But the user complained about "de un saque". Let's do linear continuous scroll for both!
             let ratio = timeElapsed / timeDiff;
             if (ratio > 1) ratio = 1;
             interpolatedPos = currentPos + (nextPos - currentPos) * ratio;
          }
          
          const offset = (containerHeight / 2) - interpolatedPos;
          lyricsText.style.transition = 'transform 0.2s linear';
          lyricsText.style.transform = `translateY(${offset}px)`;
        }
      }
    }

    if (lyricsEl) lyricsEl.classList.add('visible');
    return true;
  }

  function hexToRgba(hex, alpha) {
    if (!hex) return `rgba(10, 10, 10, ${alpha})`;
    if (hex.startsWith('rgba') || hex.startsWith('rgb')) return hex;
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const r = parseInt(hex.substring(0, 2), 16) || 10;
    const g = parseInt(hex.substring(2, 4), 16) || 10;
    const b = parseInt(hex.substring(4, 6), 16) || 10;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderCustomTexts(texts) {
    const container = document.getElementById('customTextsContainer');
    if (!container) return;
    if (!Array.isArray(texts) || texts.length === 0) {
      container.innerHTML = '';
      return;
    }
    container.innerHTML = texts.map(t => {
      if (!t || !t.text) return '';
      const posX = t.x !== undefined ? t.x : 100;
      const posY = t.y !== undefined ? t.y : 100;
      const scale = t.scale !== undefined ? t.scale : 1.0;
      const bgOpacity = (t.bg_opacity !== undefined ? t.bg_opacity : 60) / 100;
      const bgColor = t.bg_color ? hexToRgba(t.bg_color, bgOpacity) : 'transparent';
      const border = t.border_color ? `1px solid ${t.border_color}` : 'none';
      const radius = (t.border_radius !== undefined ? t.border_radius : 8) + 'px';
      const padding = (t.padding !== undefined ? t.padding : 8) + 'px 14px';
      const color = t.color || '#ffffff';
      const font = t.font_family || 'system-ui';
      const size = (t.font_size || 16) + 'px';
      const animClass = (t.animation && t.animation !== 'none') ? ` ${t.animation}` : '';

      const zIndex = t.z_index !== undefined ? t.z_index : 25;

      return `
        <div class="overlay-custom-text${animClass}" id="customText_${t.id}" style="
          position: fixed;
          left: ${posX}px;
          top: ${posY}px;
          z-index: ${zIndex};
          --scale: ${scale};
          transform: scale(${scale});
          transform-origin: top left;
          background: ${bgColor};
          border: ${border};
          border-radius: ${radius};
          padding: ${padding};
          color: ${color};
          font-family: ${font};
          font-size: ${size};
          font-weight: 700;
          box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        ">${escapeHtml(t.text)}</div>
      `;
    }).join('');
  }

  function applyConfigToOverlay(cfg) {
    if (!cfg) return;
    overlayConfig = Object.assign({}, overlayConfig, cfg);

    const root = document.documentElement;
    const container = document.getElementById('nowPlayingContainer');
    const lyricsEl = document.getElementById('lyricsContainer');
    const breakCard = document.getElementById('breakCard');
    const breakOverlay = document.getElementById('breakOverlay');

    // ─── 1. MODULO NOW PLAYING ───
    if (container) {
      const npZ = cfg.overlay_now_playing_z_index !== undefined ? cfg.overlay_now_playing_z_index : (overlayConfig.overlay_now_playing_z_index !== undefined ? overlayConfig.overlay_now_playing_z_index : 30);
      container.style.zIndex = npZ;

      const npScale = parseFloat(cfg.overlay_now_playing_scale !== undefined ? cfg.overlay_now_playing_scale : (overlayConfig.overlay_scale || 1.0));
      const npFont = cfg.overlay_now_playing_font || overlayConfig.overlay_font_family || 'system-ui';
      const npBg = cfg.overlay_now_playing_bg_color || overlayConfig.overlay_bg_color || '#0a0a0a';
      const npOp = (cfg.overlay_now_playing_bg_opacity !== undefined ? cfg.overlay_now_playing_bg_opacity : (overlayConfig.overlay_bg_opacity !== undefined ? overlayConfig.overlay_bg_opacity : 78)) / 100;
      const npBorder = cfg.overlay_now_playing_border_color || overlayConfig.overlay_border_color || 'rgba(255, 255, 255, 0.08)';
      const npRadius = (cfg.overlay_now_playing_border_radius !== undefined ? cfg.overlay_now_playing_border_radius : (overlayConfig.overlay_border_radius !== undefined ? overlayConfig.overlay_border_radius : 12)) + 'px';
      const npTextCol = cfg.overlay_now_playing_text_color || overlayConfig.overlay_text_color || '#ffffff';

      root.style.setProperty('--overlay-scale', npScale);
      root.style.setProperty('--overlay-font', npFont);
      root.style.setProperty('--bg-card', hexToRgba(npBg, npOp));
      root.style.setProperty('--border', npBorder);
      root.style.setProperty('--border-radius', npRadius);
      root.style.setProperty('--text', npTextCol);

      // Posición libre por coordenadas X/Y
      if (cfg.overlay_now_playing_x !== undefined && cfg.overlay_now_playing_y !== undefined) {
        container.style.top = '';
        container.style.right = '';
        container.style.bottom = cfg.overlay_now_playing_y + 'px';
        container.style.left = cfg.overlay_now_playing_x + 'px';
        container.style.transformOrigin = 'bottom left';
      } else {
        const posX = (overlayConfig.overlay_pos_x !== undefined ? overlayConfig.overlay_pos_x : 28) + 'px';
        const posY = (overlayConfig.overlay_pos_y !== undefined ? overlayConfig.overlay_pos_y : 28) + 'px';
        const pos = overlayConfig.overlay_position || 'bottom-left';
        container.style.top = ''; container.style.bottom = ''; container.style.left = ''; container.style.right = '';
        if (pos === 'bottom-left') { container.style.bottom = posY; container.style.left = posX; container.style.transformOrigin = 'bottom left'; }
        else if (pos === 'bottom-right') { container.style.bottom = posY; container.style.right = posX; container.style.transformOrigin = 'bottom right'; }
        else if (pos === 'top-left') { container.style.top = posY; container.style.left = posX; container.style.transformOrigin = 'top left'; }
        else if (pos === 'top-right') { container.style.top = posY; container.style.right = posX; container.style.transformOrigin = 'top right'; }
        else if (pos === 'bottom-center') { container.style.bottom = posY; container.style.left = '50%'; container.style.marginLeft = '-200px'; container.style.transformOrigin = 'bottom center'; }
        else if (pos === 'top-center') { container.style.top = posY; container.style.left = '50%'; container.style.marginLeft = '-200px'; container.style.transformOrigin = 'top center'; }
      }

      if (cfg.overlay_now_playing_width) {
        container.style.width = cfg.overlay_now_playing_width + 'px';
        container.style.maxWidth = cfg.overlay_now_playing_width + 'px';
      }

      // Onda / wave en título
      const wave = parseInt(cfg.overlay_now_playing_wave !== undefined ? cfg.overlay_now_playing_wave : (overlayConfig.overlay_text_wave || 0), 10);
      const titleEl = document.getElementById('npTitle');
      if (wave > 0) {
        const amp = (wave * 0.9) + 'px';
        const spd = Math.max(0.6, 2.6 - (wave * 0.18)) + 's';
        root.style.setProperty('--wave-amp', amp);
        root.style.setProperty('--wave-speed', spd);
        if (titleEl) titleEl.classList.add('wave-active');
      } else {
        root.style.setProperty('--wave-amp', '0px');
        if (titleEl) titleEl.classList.remove('wave-active');
      }

      // Toggles y tamaños de sub-elementos Now Playing
      const npTitleSize = (cfg.overlay_now_playing_title_size !== undefined ? cfg.overlay_now_playing_title_size : (overlayConfig.overlay_now_playing_title_size || 13)) + 'px';
      const npArtistSize = (cfg.overlay_now_playing_artist_size !== undefined ? cfg.overlay_now_playing_artist_size : (overlayConfig.overlay_now_playing_artist_size || 11)) + 'px';
      const npBadgeSize = (cfg.overlay_now_playing_badge_size !== undefined ? cfg.overlay_now_playing_badge_size : (overlayConfig.overlay_now_playing_badge_size || 9)) + 'px';

      if (titleEl) titleEl.style.fontSize = npTitleSize;
      const badgeEl = document.getElementById('npBadge');
      if (badgeEl) {
        badgeEl.style.display = (overlayConfig.overlay_show_badge !== false) ? 'flex' : 'none';
        badgeEl.style.fontSize = npBadgeSize;
      }
      const subEl = document.getElementById('npSubtitle');
      if (subEl) {
        subEl.style.display = (overlayConfig.overlay_show_artist !== false) ? 'block' : 'none';
        subEl.style.fontSize = npArtistSize;
      }
      const coverEl = document.getElementById('npCover');
      if (coverEl) coverEl.style.display = (overlayConfig.overlay_show_cover !== false) ? 'block' : 'none';
      const eqEl = document.querySelector('.np-eq');
      if (eqEl) eqEl.style.display = (overlayConfig.overlay_show_equalizer !== false) ? 'flex' : 'none';
    }

    // ─── 2. MODULO TEMPORIZADOR ("YA VUELVO / RECREO") ───
    const tmZ = cfg.overlay_timer_z_index !== undefined ? cfg.overlay_timer_z_index : (overlayConfig.overlay_timer_z_index !== undefined ? overlayConfig.overlay_timer_z_index : 20);
    if (breakOverlay) breakOverlay.style.zIndex = tmZ;
    if (breakCard) {
      breakCard.style.zIndex = tmZ;
      const tmScale = parseFloat(cfg.overlay_timer_scale || 1.0);
      const tmWidth = parseInt(cfg.overlay_timer_width || 560, 10);
      const tmBg = cfg.overlay_timer_bg_color || '#0a0a0a';
      const tmOp = (cfg.overlay_timer_bg_opacity !== undefined ? cfg.overlay_timer_bg_opacity : 85) / 100;
      const tmBorder = cfg.overlay_timer_border_color || 'rgba(232, 255, 71, 0.35)';
      const tmRadius = (cfg.overlay_timer_border_radius !== undefined ? cfg.overlay_timer_border_radius : 20) + 'px';
      const tmFont = cfg.overlay_timer_font || 'system-ui';

      breakCard.style.width = tmWidth + 'px';
      breakCard.style.background = hexToRgba(tmBg, tmOp);
      breakCard.style.borderColor = tmBorder;
      breakCard.style.borderRadius = tmRadius;
      breakCard.style.fontFamily = tmFont;

      // Coordenadas X/Y de Temporizador
      const tmX = cfg.overlay_timer_x !== undefined ? cfg.overlay_timer_x : 50;
      const tmY = cfg.overlay_timer_y !== undefined ? cfg.overlay_timer_y : 50;
      if (tmX === 50 && tmY === 50) {
        breakCard.style.left = '50%';
        breakCard.style.top = '50%';
        breakCard.style.transform = `translate(-50%, -50%) scale(${tmScale})`;
        breakCard.style.transformOrigin = 'center center';
      } else {
        breakCard.style.left = tmX + 'px';
        breakCard.style.top = tmY + 'px';
        breakCard.style.transform = `scale(${tmScale})`;
        breakCard.style.transformOrigin = 'top left';
      }

      // Sub-elementos de Temporizador y tamaños configurables
      const tmClockSize = (cfg.overlay_timer_clock_size !== undefined ? cfg.overlay_timer_clock_size : (overlayConfig.overlay_timer_clock_size || 72)) + 'px';
      const tmTitleSize = (cfg.overlay_timer_title_size !== undefined ? cfg.overlay_timer_title_size : (overlayConfig.overlay_timer_title_size || 30)) + 'px';
      const tmBadgeSize = (cfg.overlay_timer_badge_size !== undefined ? cfg.overlay_timer_badge_size : (overlayConfig.overlay_timer_badge_size || 12)) + 'px';
      const tmPhraseSize = (cfg.overlay_timer_phrase_size !== undefined ? cfg.overlay_timer_phrase_size : (overlayConfig.overlay_timer_phrase_size || 14)) + 'px';
      const tmImgEl = document.getElementById('breakTimerImage');
      if (tmImgEl) {
        if (cfg.overlay_timer_image_enabled && cfg.overlay_timer_image_url) {
          tmImgEl.style.display = 'block';
          tmImgEl.src = cfg.overlay_timer_image_url;
          const ix = cfg.overlay_timer_image_x !== undefined ? cfg.overlay_timer_image_x : 0;
          const iy = cfg.overlay_timer_image_y !== undefined ? cfg.overlay_timer_image_y : -100;
          const iscale = cfg.overlay_timer_image_scale || 1.0;
          tmImgEl.style.left = `calc(50% + ${ix}px)`;
          tmImgEl.style.top = `calc(50% + ${iy}px)`;
          tmImgEl.style.transform = `translate(-50%, -50%) scale(${iscale})`;
          tmImgEl.style.borderRadius = (cfg.overlay_timer_image_radius !== undefined ? cfg.overlay_timer_image_radius : 10) + 'px';
        } else {
          tmImgEl.style.display = 'none';
          tmImgEl.src = '';
        }
      }

      const badgePill = document.getElementById('breakHeaderPill');
      const badgeText = document.getElementById('breakBadgeText');
      if (badgePill) {
        badgePill.style.display = (cfg.overlay_timer_show_badge !== false) ? 'inline-flex' : 'none';
        badgePill.style.fontSize = tmBadgeSize;
        if (cfg.overlay_timer_badge_font) badgePill.style.fontFamily = cfg.overlay_timer_badge_font;
        if (cfg.overlay_timer_badge_text && badgeText) badgeText.textContent = cfg.overlay_timer_badge_text;
        if (cfg.overlay_timer_badge_color) {
          badgePill.style.color = cfg.overlay_timer_badge_color;
          badgePill.style.borderColor = cfg.overlay_timer_badge_color;
        }
      }

      const titleEl = document.getElementById('breakTitleText');
      if (titleEl) {
        titleEl.style.display = (cfg.overlay_timer_show_title !== false) ? 'block' : 'none';
        titleEl.style.fontSize = tmTitleSize;
        if (cfg.overlay_timer_title_font) titleEl.style.fontFamily = cfg.overlay_timer_title_font;
        if (cfg.overlay_timer_title_text && (!currentTimerState || !currentTimerState.title)) {
          titleEl.textContent = cfg.overlay_timer_title_text;
        }
        if (cfg.overlay_timer_title_color) titleEl.style.color = cfg.overlay_timer_title_color;
      }

      const clockEl = document.getElementById('breakTimerText');
      if (clockEl) {
        clockEl.style.display = (cfg.overlay_timer_show_clock !== false) ? 'block' : 'none';
        clockEl.style.fontSize = tmClockSize;
        if (cfg.overlay_timer_clock_font) clockEl.style.fontFamily = cfg.overlay_timer_clock_font;
        if (cfg.overlay_timer_clock_color) {
          clockEl.style.color = cfg.overlay_timer_clock_color;
          clockEl.style.textShadow = `0 0 24px ${hexToRgba(cfg.overlay_timer_clock_color, 0.5)}`;
        }
      }

      const progressTrack = document.getElementById('breakProgressTrack');
      const progressBar = document.getElementById('breakProgressBar');
      if (progressTrack) progressTrack.style.display = (cfg.overlay_timer_show_progress !== false) ? 'block' : 'none';
      if (progressBar && cfg.overlay_timer_progress_color) progressBar.style.background = cfg.overlay_timer_progress_color;

      const phraseBox = document.getElementById('breakPhraseBox');
      const phraseText = document.getElementById('breakPhraseText');
      if (phraseBox) {
        phraseBox.style.display = (cfg.overlay_timer_show_phrase !== false) ? 'block' : 'none';
        phraseBox.style.fontSize = tmPhraseSize;
      }
      if (phraseText) {
        if (cfg.overlay_timer_phrase_color) phraseText.style.color = cfg.overlay_timer_phrase_color;
        if (cfg.overlay_timer_phrase_font) phraseText.style.fontFamily = cfg.overlay_timer_phrase_font;
      }
    }

    // ─── 3. MODULO LYRICS (LETRAS) ───
    if (lyricsEl) {
      const lyZ = cfg.overlay_lyrics_z_index !== undefined ? cfg.overlay_lyrics_z_index : (overlayConfig.overlay_lyrics_z_index !== undefined ? overlayConfig.overlay_lyrics_z_index : 15);
      lyricsEl.style.zIndex = lyZ;

      const lyScale = parseFloat(cfg.overlay_lyrics_scale || 1.0);
      const lyWidth = parseInt(cfg.overlay_lyrics_width || 440, 10);
      const lyMaxH = parseInt(cfg.overlay_lyrics_max_height || 150, 10);
      const lyBg = cfg.overlay_lyrics_bg_color || '#0a0a0a';
      const lyOp = (cfg.overlay_lyrics_bg_opacity !== undefined ? cfg.overlay_lyrics_bg_opacity : 75) / 100;
      const lyBorder = cfg.overlay_lyrics_border_color || 'rgba(255, 255, 255, 0.08)';
      const lyRadius = (cfg.overlay_lyrics_border_radius !== undefined ? cfg.overlay_lyrics_border_radius : 12) + 'px';
      const lyTextCol = cfg.overlay_lyrics_text_color || '#e0e0e0';
      const lyFont = cfg.overlay_lyrics_font || 'system-ui';
      const lyFontSize = (cfg.overlay_lyrics_font_size || 13) + 'px';

      lyricsEl.style.width = lyWidth + 'px';
      lyricsEl.style.maxHeight = lyMaxH + 'px';
      lyricsEl.style.background = hexToRgba(lyBg, lyOp);
      lyricsEl.style.borderColor = lyBorder;
      lyricsEl.style.borderRadius = lyRadius;
      lyricsEl.style.fontFamily = lyFont;
      lyricsEl.style.transform = `scale(${lyScale})`;
      lyricsEl.style.transformOrigin = 'bottom left';

      const lt = document.getElementById('lyricsText');
      if (lt) {
        lt.style.color = lyTextCol;
        lt.style.fontSize = lyFontSize;
      }

      if (cfg.overlay_lyrics_x !== undefined && cfg.overlay_lyrics_y !== undefined) {
        lyricsEl.style.left = cfg.overlay_lyrics_x + 'px';
        lyricsEl.style.bottom = cfg.overlay_lyrics_y + 'px';
      }
    }

    // ─── 4. TEXTOS PERSONALIZADOS MODULARES ───
    renderCustomTexts(cfg.overlay_custom_texts || overlayConfig.overlay_custom_texts || []);

    updateNowPlayingUI();
    fetchAndUpdateLyrics();
  }

  // Audio chime
  function playSchoolBellChime() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const startTime = ctx.currentTime + (idx * 0.22);
        gain.gain.setValueAtTime(0.01, startTime);
        gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.85);
      });
    } catch(e) {}
  }

  function updateTimerUI(data) {
    if (!data) return;
    currentTimerState = data;
    const overlay = document.getElementById('breakOverlay');
    const timerText = document.getElementById('breakTimerText');
    const titleText = document.getElementById('breakTitleText');
    const phraseText = document.getElementById('breakPhraseText');
    const bar = document.getElementById('breakProgressBar');

    if (!data.active || overlayConfig.overlay_enabled === false || overlayConfig.overlay_timer_enabled === false) {
      overlay.classList.remove('visible');
      timerText.classList.remove('finished');
      return;
    }

    overlay.classList.add('visible');
    const rem = Math.max(0, data.remaining_seconds || 0);
    const m = Math.floor(rem / 60);
    const s = rem % 60;
    timerText.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

    if (data.title) titleText.textContent = data.title;
    if (data.phrase) phraseText.textContent = data.phrase;

    const total = data.total_seconds || 300;
    const pct = Math.max(0, Math.min(100, (rem / total) * 100));
    bar.style.width = pct + '%';

    if (rem <= 0) {
      timerText.classList.add('finished');
      timerText.textContent = '00:00';
      bar.style.width = '0%';
      const now = Date.now();
      if (data.play_sound && (now - lastChimePlayedFor > 8000)) {
        lastChimePlayedFor = now;
        playSchoolBellChime();
      }
    } else {
      timerText.classList.remove('finished');
    }
  }

  function updateNowPlayingUI() {
    const container = document.getElementById('nowPlayingContainer');
    const lyricsEl = document.getElementById('lyricsContainer');
    const cover = document.getElementById('npCover');
    const badge = document.getElementById('npBadge');
    const icon = document.getElementById('npSourceIcon');
    const sourceText = document.getElementById('npSourceText');
    const title = document.getElementById('npTitle');
    const sub = document.getElementById('npSubtitle');

    if (overlayConfig.overlay_enabled === false || overlayConfig.overlay_now_playing_enabled === false) {
      container.classList.remove('visible');
      if (lyricsEl) lyricsEl.classList.remove('visible');
      return;
    }

    // Spotify Now Playing
    if (currentSpotify && currentSpotify.is_playing && currentSpotify.title) {
      container.classList.add('visible');
      badge.className = 'np-badge spotify';
      icon.textContent = '🎵';
      sourceText.textContent = 'SPOTIFY';

      title.style.display = (overlayConfig.overlay_show_song_title !== false && overlayConfig.overlay_show_title !== false) ? 'block' : 'none';
      
      if (overlayConfig.overlay_now_playing_marquee === true) {
        if (!title.querySelector('.ticker-wrap')) {
          title.innerHTML = `<div class="ticker-wrap" style="width:100%; overflow:hidden; white-space:nowrap; mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%); -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);"><div class="ticker-move" style="display:inline-block; animation:ticker 10s linear infinite;"><span class="ticker-item" style="display:inline-block; padding-right:50px;"></span><span class="ticker-item" style="display:inline-block; padding-right:50px;"></span></div></div>`;
        }
        const items = title.querySelectorAll('.ticker-item');
        if (items[0] && items[0].textContent !== currentSpotify.title) {
          items[0].textContent = currentSpotify.title;
          items[1].textContent = currentSpotify.title;
          const move = title.querySelector('.ticker-move');
          if (move) {
            move.style.animation = 'none';
            void move.offsetWidth;
            move.style.animation = 'ticker 10s linear infinite';
          }
        }
      } else {
        if (title.querySelector('.ticker-wrap')) {
          title.textContent = currentSpotify.title; // remove wrap
        } else if (title.textContent !== currentSpotify.title) {
          title.textContent = currentSpotify.title;
        }
      }

      sub.style.display = (overlayConfig.overlay_show_artist !== false) ? 'block' : 'none';
      sub.textContent = currentSpotify.artist || 'Música en PC';

      if (overlayConfig.overlay_show_cover !== false) {
        let coverUrl = currentSpotify.album_art || currentSpotify.cover_url || currentSpotify.cover || '';
        if (coverUrl.startsWith('spotify:image:')) {
          coverUrl = 'https://i.scdn.co/image/' + coverUrl.split(':').pop();
        } else if (coverUrl.startsWith('https://open.spotify.com/image/')) {
          coverUrl = 'https://i.scdn.co/image/' + coverUrl.split('/').pop();
        }
        cover.src = coverUrl || '/assets/icon.png';
        cover.onerror = () => { cover.onerror = null; cover.src = '/assets/icon.png'; };
        cover.style.display = 'block';
      } else {
        cover.style.display = 'none';
      }
      return;
    }

    // Solo mostrar el rectángulo cuando se reproduce música
    container.classList.remove('visible');
    if (lyricsEl) lyricsEl.classList.remove('visible');
  }

  async function fetchAndUpdateLyrics() {
    const lyricsEl = document.getElementById('lyricsContainer');
    if (!lyricsEl) return;

    if (overlayConfig.overlay_enabled === false || overlayConfig.overlay_show_lyrics === false || !currentSpotify.is_playing || !currentSpotify.title) {
      lyricsEl.classList.remove('visible');
      return;
    }

    const query = (currentSpotify.artist || '') + ' - ' + (currentSpotify.title || '');
    if (query === lastLyricsQuery && currentLyrics) {
      if (!updateSyncedLyrics(currentSpotify.progress_ms)) lyricsEl.classList.add('visible');
      return;
    }

    lastLyricsQuery = query;
    currentLyrics = '';
    lyricsEl.classList.remove('visible');

    try {
      const art = encodeURIComponent((currentSpotify.artist || '').trim());
      const tit = encodeURIComponent((currentSpotify.title || '').trim());
      const res = await fetch(`/api/spotify/lyrics?artist=${art}&title=${tit}`);
      const data = await res.json();
      if (data.lyrics && data.lyrics.trim()) {
        currentLyrics = data.lyrics.trim();
        currentSyncedLyrics = parseSyncedLyrics(data.syncedLyrics);
        const lt = document.getElementById('lyricsText');
        lt.textContent = currentLyrics;
        lt.style.transform = 'translateY(0)';
        lyricsEl.classList.add('visible');

        clearInterval(lyricsInterval);
        lyricsOffset = 0;
        if (currentSyncedLyrics.length && currentSpotify.progress_ms !== undefined) {
          updateSyncedLyrics(currentSpotify.progress_ms);
        } else {
          lyricsInterval = setInterval(() => {
            lyricsOffset -= 14;
            if (Math.abs(lyricsOffset) > lt.scrollHeight) lyricsOffset = 0;
            lt.style.transform = `translateY(${lyricsOffset}px)`;
          }, 2200);
        }
      }
    } catch(e) {}
  }

  function initSSE() {
    const evtSource = new EventSource('/api/events');

    evtSource.addEventListener('config_updated', (e) => {
      try {
        const d = JSON.parse(e.data).data;
        applyConfigToOverlay(d);
      } catch(err) {}
    });

    evtSource.addEventListener('timer_update', (e) => {
      try { updateTimerUI(JSON.parse(e.data).data); } catch(err) {}
    });

    evtSource.addEventListener('timer_finished', (e) => {
      try {
        const d = JSON.parse(e.data).data;
        updateTimerUI(d);
        playSchoolBellChime();
      } catch(err) {}
    });

    evtSource.addEventListener('spotify_state', (e) => {
      try {
        const d = JSON.parse(e.data); currentSpotify = d.data || d;
        updateNowPlayingUI();
        updateSyncedLyrics(currentSpotify.progress_ms);
        fetchAndUpdateLyrics();
      } catch(err) {}
    });

    evtSource.onerror = () => {
      setTimeout(initSSE, 3000);
    };
  }

  async function fetchInitialState() {
    try {
      const resC = await fetch('/api/config');
      const dataC = await resC.json();
      applyConfigToOverlay(dataC);
    } catch(e) {}

    try {
      const resT = await fetch('/api/timer/status');
      const dataT = await resT.json();
      updateTimerUI(dataT);
    } catch(e) {}

    try {
      const resSp = await fetch('/api/spotify/state');
      const dataSp = await resSp.json();
      if (dataSp && dataSp.available) {
        currentSpotify = dataSp;
        updateNowPlayingUI();
        updateSyncedLyrics(currentSpotify.progress_ms);
        fetchAndUpdateLyrics();
      } else {
        updateNowPlayingUI();
      }
    } catch(e) {
      updateNowPlayingUI();
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    fetchInitialState();
    initSSE();
  });

</script>
